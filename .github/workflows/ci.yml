name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint-test-build-typecheck:
    name: Lint, Test, Build, Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install pip-audit

      - name: Lint
        run: ruff check .

      - name: Run pytest
        run: pytest -q

      - name: Run security tests
        run: pytest -q tests/security

      - name: Artifact hygiene
        run: |
          python - <<'PY'
          import subprocess
          import sys

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          banned_dirs = ("node_modules/", "dist/", "build/")
          banned = [p for p in tracked if p.startswith(banned_dirs)]
          zips = [p for p in tracked if p.lower().endswith(".zip")]
          large_zips = []
          for p in zips:
            try:
              size = int(subprocess.check_output(["git", "cat-file", "-s", f"HEAD:{p}"], text=True).strip())
            except Exception:
              continue
            if size > 5 * 1024 * 1024:
              large_zips.append((p, size))
          if banned or large_zips:
            if banned:
              print("Banned tracked artifacts:")
              for p in banned:
                print(" -", p)
            if large_zips:
              print("Large zip artifacts (>5MB):")
              for p, size in large_zips:
                print(f" - {p} ({size} bytes)")
            sys.exit(1)
          print("Artifact hygiene check passed.")
          PY

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install pipdeptree
          pip install pip-audit

      - name: Run pip-audit
        run: python -m pip_audit

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Show dependency tree
        run: python -m pipdeptree --warn fail

  ui-smoke-browser:
    name: UI smoke (with Playwright)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Run UI smoke tests
        run: pytest -q tests/test_ui_smoke.py

  release-readiness:
    name: Release Readiness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run release check
        run: python scripts/release_check.py

      - name: Packaging smoke tests
        run: pytest -q tests/test_packaging_smoke.py
